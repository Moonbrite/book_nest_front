<section class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4 text-center">
        <h1 class="mb-4">CONNEXION</h1>
        <p>Nouveau sur BookNest ?<br><a routerLink="/register">Créez un compte ici</a>.</p>
      </div>
      <div class="col-md-6">
        <div class="card shadow p-4">
          <form (ngSubmit)="connectUser()" #loginform="ngForm" method="post">
            <div class="mb-3">
              <label for="inputEmail" class="form-label">Email</label>
              <input type="text" id="inputEmail" name="email" class="form-control" placeholder="Email" [(ngModel)]="authRequest.email" required>
            </div>
            <div class="mb-3">
              <label for="inputPassword" class="form-label">Mot de passe</label>
              <input type="password" id="inputPassword" name="password" class="form-control" placeholder="Mot de passe" [(ngModel)]="authRequest.password" required>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <h3 *ngIf="error" class="text-danger fs-6">Les identifiants ne sont pas corrects !</h3>
              <button id="btn-connect" class="btn btn-primary" type="submit">Continuer</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4 text-center">
        <h1 class="mb-4">CRÉATION DE COMPTE</h1>
        <p>Déjà un compte ?<br><a routerLink="/login">Connecte-toi ici</a>.</p>
      </div>
      <div class="col-md-6">
        <div class="card shadow p-4">
          <form (ngSubmit)="addUser()" #registerform="ngForm" method="post">
            <div class="mb-3">
              <label for="inputName" class="form-label">Nom</label>
              <input type="text" id="inputName" name="name" class="form-control" placeholder="Nom" [(ngModel)]="user.name" required>
            </div>
            <div class="mb-3">
              <label for="inputEmail" class="form-label">Email</label>
              <input type="email" id="inputEmail" name="email" class="form-control" placeholder="Email" [(ngModel)]="user.email" required>
            </div>
            <div class="mb-3">
              <label for="inputPassword" class="form-label">Mot de passe</label>
              <input type="password" id="inputPassword" name="password" class="form-control" placeholder="Mot de passe" [(ngModel)]="user.password" required>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <h3 *ngIf="error" class="text-danger fs-6">{{error}}</h3>
              <button id="btn-register" class="btn btn-primary" type="submit" [disabled]="!registerform.valid">Soumettre</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
